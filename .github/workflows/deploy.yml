# Build MyST site on every PR; deploy to GitHub Pages only from main.
# Based on: https://mystmd.org/guide/deployment-github-pages

name: MyST GitHub Pages Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

env:
  # Site is served at https://certik.github.io/qed/
  # Use BASE_URL: '' if this becomes a user/org site (username.github.io)
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated PR runs; never cancel an in-progress main deploy
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets
        run: myst build --html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

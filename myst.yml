  math:
    # Feynman slash: full solidus overlapped on the letter. KaTeX \not sits
    # too far left (combining overlay); 0.20em was too far right. 0.06em
    # lands the stroke on the stem of italic p/k.
    '\slashed': '\mathrlap{\hspace{0.06em}/}{#1}'

[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
name = "qed"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
start = "myst start"
build = "myst build --html"

figures = "python code/feynman_diagrams.py"
lo-sympy = "python code/g2_lo.py"
iie-sympy = "python code/g2_iie.py"
iie-fortran = { cmd = "mkdir -p _build/fortran && flang -O3 -march=native -ffast-math code/g2_iie.f90 -o _build/fortran/g2_iie && _build/fortran/g2_iie" }
lo-trace-sympy = "python code/g2_lo_trace.py"
iid-sympy = { cmd = "python code/g2_iid.py", cwd = "code" }
# add -fopenmp (plus -Wl,-rpath,<flang-install>/lib on macOS) to parallelize
iid-fortran = { cmd = "mkdir -p ../_build/fortran && flang -O3 -march=native -ffast-math g2_iid.f90 -o ../_build/fortran/g2_iid && ../_build/fortran/g2_iid", cwd = "code" }
iid-analytic = { cmd = "python g2_iid_analytic.py", cwd = "code" }
iic-sympy = { cmd = "python g2_iic.py", cwd = "code" }
iic-fortran = { cmd = "mkdir -p ../_build/fortran && flang -O3 -march=native -ffast-math g2_iic.f90 -o ../_build/fortran/g2_iic && ../_build/fortran/g2_iic", cwd = "code" }
iic-analytic = { cmd = "python g2_iic_analytic.py && python g2_iic_a_sint.py && python g2_iic_c_red.py", cwd = "code" }
# the quad-precision A*/C* integrators need gfortran (real(16)):
#   pixi exec --spec gfortran -- gfortran -O2 -fopenmp g2_iic_a_quad.f90 ...
iia-sympy = { cmd = "python g2_iia.py", cwd = "code" }
# quad-precision (gfortran) checks of IIa pieces (a) and (c):
#   pixi exec --spec gfortran -- gfortran -O1 -fopenmp g2_iia_a3.f90 ...
#   pixi exec --spec gfortran -- gfortran -O1 -fopenmp g2_iia_cq.f90 ...
iia-fit = { cmd = "python g2_iia_fit.py", cwd = "code" }
i-sympy = { cmd = "python g2_i.py && python g2_i_split.py", cwd = "code" }
# mixed double/quad precision => gfortran (flang has no real(16) here)
i-fortran = { cmd = "mkdir -p ../_build/fortran && pixi exec --spec gfortran -- gfortran -O2 -fopenmp -I. g2_i_qmc.f90 -o ../_build/fortran/g2_i_qmc && ../_build/fortran/g2_i_qmc", cwd = "code" }
i-calibrate = { cmd = "pixi exec --spec gfortran -- gfortran -O2 -I. g2_i_cal.f90 -o ../_build/fortran/g2_i_cal && ../_build/fortran/g2_i_cal", cwd = "code" }
assembly = { cmd = "python g2_assembly.py", cwd = "code" }
# worked-example chapter (diagram IId, step by step)
iid-selfenergy = { cmd = "python g2_iid_selfenergy.py", cwd = "code" }
iid-covariant = { cmd = "python g2_iid_covariant.py", cwd = "code" }
g2-nlo = { depends-on = ["lo-sympy", "iie-sympy", "iie-fortran"] }

[dependencies]
mystmd = ">=1.10.1,<2"
sympy = ">=1.14.0,<2"
mpmath = ">=1.4.1,<2"
matplotlib = ">=3.11.1,<4"
